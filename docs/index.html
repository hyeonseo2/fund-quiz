<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fund Quiz</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;color:#111827}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
    input{padding:10px;border:1px solid #d1d5db;border-radius:8px;width:100%}
    button{background:#2563eb;color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    .small-btn{background:#eef2ff;color:#1e3a8a}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .fund{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px}
    .q{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-top:8px}
    .muted{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <h1>펀드 설명서 이해도 퀴즈</h1>
  <p class="muted">OpenDART 공시 기반 정적 데이터로 매일 갱신됩니다.</p>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <input id="search" placeholder="펀드명/운용사 검색" />
      <button onclick="renderFunds()">검색</button>
    </div>
    <div id="meta" class="muted"></div>
    <div id="funds"></div>
  </div>

  <div class="card" id="quizCard" style="display:none">
    <h3 id="quizTitle"></h3>
    <form id="quizForm"></form>
    <div class="row" style="margin-top:10px">
      <button type="button" onclick="submitQuiz()">채점하기</button>
      <button type="button" class="small-btn" onclick="closeQuiz()">닫기</button>
    </div>
    <div id="result" style="margin-top:10px"></div>
  </div>

<script>
let DATA = { funds: [] };
let CURRENT = null;

async function loadData(){
  const res = await fetch('./data/funds.json', { cache: 'no-store' });
  DATA = await res.json();
  const d = new Date(DATA.generated_at);
  document.getElementById('meta').textContent = `총 ${DATA.count || 0}개 · 업데이트: ${d.toLocaleString()}`;
  renderFunds();
}

function renderFunds(){
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const funds = (DATA.funds || []).filter(f => !q || f.fund_name.toLowerCase().includes(q) || (f.manager_name||'').toLowerCase().includes(q));
  const el = document.getElementById('funds');
  if(!funds.length){ el.innerHTML = '<p class="muted">검색 결과가 없습니다.</p>'; return; }
  el.innerHTML = funds.slice(0, 100).map(f => `
    <div class="fund">
      <div><b>${escapeHtml(f.fund_name)}</b></div>
      <div class="muted">${escapeHtml(f.manager_name || '-')} · ${escapeHtml(f.latest_disclosure_date || '-')}</div>
      <div class="row" style="margin-top:8px">
        <button onclick="openQuiz(${f.fund_id})">퀴즈</button>
        <a class="small-btn" style="text-decoration:none;padding:8px 10px;border-radius:8px;display:inline-block" href="${f.viewer_url}" target="_blank" rel="noopener">공시 링크</a>
      </div>
    </div>
  `).join('');
}

function openQuiz(id){
  CURRENT = (DATA.funds || []).find(f => f.fund_id === id);
  if(!CURRENT) return;
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('quizTitle').textContent = `${CURRENT.quiz?.title || '퀴즈'} (${(CURRENT.quiz?.questions || []).length}문항)`;
  const form = document.getElementById('quizForm');
  form.innerHTML = '';
  (CURRENT.quiz?.questions || []).forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q';
    div.innerHTML = `<b>${i+1}. ${escapeHtml(q.prompt)}</b><br/>` +
      (q.choices || []).map((c, ci) => `<label><input type='radio' name='q${i}' value='${ci}'/> ${escapeHtml(c)}</label><br/>`).join('');
    form.appendChild(div);
  });
  document.getElementById('result').innerHTML = '';
  document.getElementById('quizCard').scrollIntoView({behavior:'smooth'});
}

function submitQuiz(){
  if(!CURRENT) return;
  const qs = CURRENT.quiz?.questions || [];
  let score = 0;
  const lines = [];
  qs.forEach((q, i) => {
    const picked = document.querySelector(`input[name='q${i}']:checked`);
    const ok = picked && Number(picked.value) === Number(q.answer_index);
    if(ok) score += 1;
    lines.push(`
      <div class='q'>
        <b>문항 ${i+1}</b> · ${ok ? '정답' : '오답'}<br/>
        해설: ${escapeHtml(q.explanation || '-') }<br/>
        <a href='${CURRENT.viewer_url}' target='_blank' rel='noopener'>공시 링크</a>
      </div>
    `);
  });
  document.getElementById('result').innerHTML = `<h3>채점 결과: ${score}/${qs.length}</h3>` + lines.join('');
}

function closeQuiz(){
  document.getElementById('quizCard').style.display = 'none';
}

function escapeHtml(v){
  return String(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

loadData();
</script>
</body>
</html>
