name: Build Static Data (Daily)

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build static dataset
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CORP_CODES: ${{ secrets.CORP_CODES }}
          MAJOR_MANAGER_LIMIT: ${{ vars.MAJOR_MANAGER_LIMIT }}
          PER_CORP_LIMIT: ${{ vars.PER_CORP_LIMIT }}
        run: |
          python scripts/build_static_data.py

      - name: Commit and push dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/funds.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(data): refresh static quiz dataset"
          git push
