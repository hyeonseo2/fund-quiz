version: '3.9'

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "8080:8080"
    restart: always

  worker:
    build: .
    command: python -m app.workers.worker
    env_file: .env
    volumes:
      - .:/app
      - ./storage:/app/storage
    restart: always
